name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finledger
          POSTGRES_PASSWORD: finledger-ci
          POSTGRES_DB: finledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finledger -d finledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger-ci
      POSTGRES_DB: finledger
      JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Apply migrations to a clean database
        run: uv run alembic upgrade head

      - name: Pytest (unit + PostgreSQL integration)
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: finledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
